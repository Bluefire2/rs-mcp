name: Skill wiki links

# The osrs-coach skill points at OSRS Wiki hub pages. Check they still exist whenever the skill
# changes, and weekly in case the Wiki renames one. Kept apart from CI so a Wiki outage can't
# fail a code change.
on:
  push:
    branches: [master]
    paths: ["skills/**", "scripts/check_skill_wiki_links.py"]
  pull_request:
    paths: ["skills/**", "scripts/check_skill_wiki_links.py"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-dev
      - name: Check titles
        env:
          # The Wiki asks API clients for a descriptive User-Agent.
          USER_AGENT: osrs-mcp-ci/0.1 (+https://github.com/${{ github.repository }})
        run: uv run python scripts/check_skill_wiki_links.py
