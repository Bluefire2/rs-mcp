[project]
name = "osrs-mcp"
version = "0.1.0"
description = "Personal remote MCP server exposing an Old School RuneScape account to Claude"
authors = [
    { name = "Kyrylo Chernyshov", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
    "py-key-value-aio[firestore]>=0.4.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[project.scripts]
osrs-mcp = "osrs_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
